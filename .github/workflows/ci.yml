name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,voice]"

      - name: Run Python tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/mobile/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install mobile dependencies
        working-directory: desktop/mobile
        run: npm ci

      - name: Run mobile tests
        working-directory: desktop/mobile
        run: npm test -- --run

      - name: Type-check mobile
        working-directory: desktop/mobile
        run: npm run typecheck

      - name: Build mobile
        working-directory: desktop/mobile
        run: npm run build

  rust:
    name: Rust checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Prepare Tauri resource globs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/sidecar, resources/codex, resources/reasonix, resources/mobile-dist | Out-Null
          Set-Content -Path resources/sidecar/ci-placeholder.txt -Value "CI resource placeholder" -NoNewline
          Set-Content -Path resources/codex/ci-placeholder.txt -Value "CI resource placeholder" -NoNewline
          Set-Content -Path resources/reasonix/ci-placeholder.txt -Value "CI resource placeholder" -NoNewline
          Set-Content -Path resources/mobile-dist/ci-placeholder.txt -Value "CI resource placeholder" -NoNewline

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test --locked
