[package]
name = "hsr-partner-harness"
version = "0.4.1"
description = "HSR Partner Harness desktop shell"
authors = ["Jonah Wu"]
edition = "2021"

# Android 壳以 cdylib 加载应用主体；桌面二进制入口在 src/main.rs。
[lib]
name = "hsr_partner_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.0", features = [] }
tauri-plugin-dialog = "2"
# Android 壳的本地通知插件；桌面前端没有调用方。
tauri-plugin-notification = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

# Sidecar 放进 KILL_ON_JOB_CLOSE 作业对象，结束时连同它拉起的子进程一起结束。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
