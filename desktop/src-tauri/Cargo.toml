[package]
name = "hsr-partner-harness"
version = "0.3.5"
description = "HSR Partner Harness desktop shell"
authors = ["Jonah Wu"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.0", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
