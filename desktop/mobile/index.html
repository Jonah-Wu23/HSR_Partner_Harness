<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 供 safe-area 使用；interactive-widget=resizes-content 让软键盘
         弹出时收缩布局高度，聊天输入区不被遮挡（Android Chrome 108+ 生效，iOS Safari 忽略该值）。
         不设置 maximum-scale / user-scalable，保留用户缩放。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>搭档手机端</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
