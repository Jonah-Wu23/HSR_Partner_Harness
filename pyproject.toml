[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pair-harness"
version = "0.3.7"
description = "Desktop roleplay and coding harness research MVP"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
voice = ["numpy>=1.26", "sounddevice>=0.5", "onnxruntime>=1.18", "dashscope>=1.20"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pyinstaller>=6.0"]

[project.scripts]
pair-harness = "pair_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 桌面已迁移至 Tauri。旧环境的 pytest-qt 会自动加载 PyQt5 自带的
# MSVCP140 14.26，与 onnxruntime 所需的新运行库冲突；本项目没有 Qt 测试。
# 仅禁用遗留 Qt 插件，保留 faulthandler 等错误诊断。
addopts = "-p no:pytest-qt"
asyncio_mode = "auto"
markers = [
    "live: requires live credentials (DeepSeek dialogue + codex app-server)",
    "live_qwen: requires live DashScope credentials",
]
